[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-engine-strength-benchmark"
version = "0.1.0"
description = "Reproducible round-robin strength benchmark for Maia 2 and Maia 3"
requires-python = ">=3.9"
dependencies = [
  "python-chess==1.999",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
maia-benchmark = "maia_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
