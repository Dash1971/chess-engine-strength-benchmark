[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-engine-strength-benchmark"
version = "0.3.0"
description = "Simple color-balanced match runner for installed UCI chess engines"
requires-python = ">=3.9"
dependencies = [
  "chess==1.11.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "ruff==0.12.12"]

[project.scripts]
maia-benchmark = "maia_benchmark.cli:main"
maia-benchmark-gui = "maia_benchmark.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
