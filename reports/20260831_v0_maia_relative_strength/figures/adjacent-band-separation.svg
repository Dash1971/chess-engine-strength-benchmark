<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Adjacent-band realized Elo gaps</title>
  <desc id="chart-desc">Grouped horizontal bars show that all Maia 3 adjacent bands separated more strongly than the corresponding Maia 2 bands.</desc>
  <rect width="960" height="650" fill="#ffffff"/>
  <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
