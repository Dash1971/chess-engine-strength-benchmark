<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">High-rating nominal and realized gaps</title>
  <desc id="chart-desc">The nominal 500-point gap from 1600 to 2100 produced a realized 260.5 Elo gap, while the nominal 700-point gap from 1600 to 2300 produced a realized 246.3 Elo gap.</desc>
  <rect width="960" height="490" fill="#ffffff"/>
  <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
      .subtitle { font: 400 19px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5b6475; }
      .label { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
      .value { font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172033; }
      .small { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5b6475; }
      .tiny { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5b6475; }
      .inverse { font: 700 23px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #ffffff; }
    </style>
  <text x="40.0" y="48.0" class="title" text-anchor="start">Nominal high-rating gaps versus realized gaps</text>
  <text x="40.0" y="82.0" class="subtitle" text-anchor="start">The score-to-Elo separation was much smaller than the conditioning-label gap.</text>
  <line x1="260.0" y1="105.0" x2="260.0" y2="410.0" stroke="#d8dee9" stroke-width="1.0"/>
  <text x="260.0" y="438.0" class="small" text-anchor="middle">0</text>
  <line x1="431.4" y1="105.0" x2="431.4" y2="410.0" stroke="#d8dee9" stroke-width="1.0" stroke-dasharray="5 6"/>
  <text x="431.4" y="438.0" class="small" text-anchor="middle">200</text>
  <line x1="602.9" y1="105.0" x2="602.9" y2="410.0" stroke="#d8dee9" stroke-width="1.0" stroke-dasharray="5 6"/>
  <text x="602.9" y="438.0" class="small" text-anchor="middle">400</text>
  <line x1="774.3" y1="105.0" x2="774.3" y2="410.0" stroke="#d8dee9" stroke-width="1.0" stroke-dasharray="5 6"/>
  <text x="774.3" y="438.0" class="small" text-anchor="middle">600</text>
  <line x1="860.0" y1="105.0" x2="860.0" y2="410.0" stroke="#d8dee9" stroke-width="1.0"/>
  <text x="860.0" y="438.0" class="small" text-anchor="middle">700</text>
  <text x="860.0" y="468.0" class="small" text-anchor="end">Elo points</text>
  <text x="40.0" y="148.0" class="label" text-anchor="start">1600–2100</text>
  <text x="244.0" y="149.0" class="small" text-anchor="end">Nominal</text>
  <rect x="260.0" y="130.0" width="428.6" height="28.0" rx="5.0" fill="#64748b"/>
  <text x="700.6" y="151.0" class="value" text-anchor="start">500</text>
  <text x="244.0" y="195.0" class="small" text-anchor="end">Realized</text>
  <rect x="260.0" y="176.0" width="223.3" height="28.0" rx="5.0" fill="#2563eb"/>
  <text x="495.3" y="197.0" class="value" text-anchor="start">260.5</text>
  <text x="260.0" y="235.0" class="small" text-anchor="start">52.1% of nominal gap preserved</text>
  <text x="40.0" y="293.0" class="label" text-anchor="start">1600–2300</text>
  <text x="244.0" y="294.0" class="small" text-anchor="end">Nominal</text>
  <rect x="260.0" y="275.0" width="600.0" height="28.0" rx="5.0" fill="#64748b"/>
  <text x="872.0" y="296.0" class="value" text-anchor="start">700</text>
  <text x="244.0" y="340.0" class="small" text-anchor="end">Realized</text>
  <rect x="260.0" y="321.0" width="211.1" height="28.0" rx="5.0" fill="#2563eb"/>
  <text x="483.1" y="342.0" class="value" text-anchor="start">246.3</text>
  <text x="260.0" y="380.0" class="small" text-anchor="start">35.2% of nominal gap preserved</text>
</svg>
